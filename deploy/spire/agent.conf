# SPIRE agent for the lab. Reads its one-time join token from a file that
# register-entries.sh writes before the agent is started, so node attestation
# is fully automatic and needs no shell inside the SPIRE images.
agent {
    data_dir       = "/opt/spire/data"
    log_level      = "INFO"
    server_address = "spire-server"
    server_port    = "8081"
    trust_domain   = "mcp.lab"

    # The public Workload API socket the workloads read their SVIDs from.
    # Matches SPIFFE_ENDPOINT_SOCKET=unix:///spiffe/api.sock in docker-compose.
    socket_path = "/spiffe/api.sock"

    # One-time join token, written by register-entries.sh into a shared mount.
    join_token_file = "/run/spire/bootstrap/agent-token"

    # SCOPE: this lab models a rogue MCP *server*, not a compromised SPIRE
    # control plane. On a single host the agent trusts the server on first
    # contact instead of pinning a pre-shared bundle. To harden, drop this and
    # set trust_bundle_path to the server's bootstrap bundle.
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # Workload attestation by container label: an entry can say "the container
    # labelled network-config gets this SVID". The rogue carries a label too,
    # but NO entry maps to it — so it gets nothing.
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }
}
