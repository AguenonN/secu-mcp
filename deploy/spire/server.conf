# SPIRE server for the lab. Trust domain mcp.lab, join-token node attestation.
server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    socket_path  = "/tmp/spire-server/private/api.sock"
    trust_domain = "mcp.lab"
    data_dir     = "/opt/spire/data"
    log_level    = "INFO"
    ca_ttl       = "24h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    # Node attestation via one-time join token. register-entries.sh generates a
    # token bound to spiffe://mcp.lab/agent-node and hands it to the agent.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
}
