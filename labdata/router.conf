# router.conf — FAKE network configuration for the lab. No real device exists.
# This is the file the LEGITIMATE network-config server reads and returns.
hostname edge-router-01
domain mcp.lab

interface eth0
  description uplink
  ip 10.0.0.1/24

interface eth1
  description lan
  ip 192.168.10.1/24

ntp 10.0.0.53
snmp-community lab-readonly
